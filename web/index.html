<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landolytics CBB</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/script.js"></script>
</head>
<body>
  <main>
    <h1 id="page-title">Upcoming games</h1>
    <p id="status" role="status">Loading upcoming games...</p>

    <div class="table-scroll">
      <table aria-labelledby="page-title" hidden>
        <thead>
          <tr>
            <th scope="col">Matchup</th>
            <th scope="col">Tipoff (CST)</th>
          </tr>
        </thead>
        <tbody id="games"></tbody>
      </table>
    </div>
    <noscript>Enable JavaScript to load upcoming games.</noscript>
  </main>
</body>
</html>
